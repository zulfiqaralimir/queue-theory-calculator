name: Flutter CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Get dependencies
      working-directory: ./mobile
      run: flutter pub get
    
    - name: Analyze code
      working-directory: ./mobile
      run: flutter analyze
    
    - name: Run tests
      working-directory: ./mobile
      run: flutter test
    
    - name: Build APK
      working-directory: ./mobile
      run: flutter build apk --release
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Get dependencies
      working-directory: ./mobile
      run: flutter pub get
    
    - name: Run tests
      working-directory: ./mobile
      run: flutter test
    
    - name: Build iOS (no signing)
      working-directory: ./mobile
      run: flutter build ios --release --no-codesign
